name: 議場写真の調査（開発用・一時的）
on:
  push:
    branches: ["ccr-*"]
    paths: ["scripts/kaiha/probe_images.py", "probe/image_targets.json"]
permissions:
  contents: write
concurrency:
  group: probe-images
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/kaiha/probe_images.py 2>&1 | tee probe/images.log
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -q -m "議場写真の調査結果を保存" || exit 0
          git pull -q --rebase
          git push -q
