name: 会派ページ調査（開発用）

# 読み取り設定を作るための一時的な調査。各県のサイトを巡回して結果を probe/ にコミットする。
on:
  workflow_dispatch:
  push:
    branches: ["ccr-*"]
    paths: ["scripts/kaiha/probe_targets.py", "probe/targets.json", "scripts/kaiha/sites.json", "probe/RUN"]

permissions:
  contents: write

concurrency:
  group: probe-${{ github.ref }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/kaiha/probe_targets.py
        if: hashFiles('probe/targets.json') != ''
      - name: 本番と同じ会派取得を試す
        run: |
          python scripts/kaiha/update_kaiha.py 2>&1 | tee probe/update_kaiha.log
          cp kaiha-report.md probe/ 2>/dev/null || rm -f probe/kaiha-report.md
          cp src/data/kaiha.json probe/kaiha.json
          git checkout -- src
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "調査結果を保存" || exit 0
          git pull --rebase
          git push
