name: 整合性確認（一時）
on:
  push:
    branches: [ccr-89053b95-9m18i5]
    paths: [".github/workflows/probe-check.yml", "probe/probe_check.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python probe/probe_check.py 2>&1 | tee probe/check.log
      - name: 修正した知事取得を試す
        run: |
          python scripts/governors/update_governors.py 2>&1 | tee probe/governors.log
          cp src/data/governors.json probe/check/governors.json
          git checkout -- src
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "調査結果を保存" || exit 0
          git pull --rebase
          git push
