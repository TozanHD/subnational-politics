name: 知事情報の調査（開発用・一時的）
on:
  push:
    branches: ["ccr-*"]
    paths: ["scripts/governors/update_governors.py"]
permissions:
  contents: write
concurrency:
  group: probe-governors
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: mkdir -p probe && python scripts/governors/update_governors.py 2>&1 | tee probe/governors_update.log
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe src/data/governors.json
          git commit -q -m "知事情報の調査結果を保存" || exit 0
          git pull -q --rebase
          git push -q
